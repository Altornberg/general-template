name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ZIP_NAME: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
  APP_FILES: ""  # space-separated list of files/dirs to include in the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          # add your environment setup here

      - name: Run tests
        run: |
          # add your test command here

      - name: Package application
        run: |
          mkdir artifact
          cp -r $APP_FILES artifact/
          zip -r "$ZIP_NAME" artifact/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
